name: Contributor Responded
on:
  # The shared workflow only updates issue/PR labels using a quoted issue number
  # from an environment variable. It never checks out contributor code or
  # executes comment text. Reassess this exception if the shared workflow changes.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created, edited]

jobs:
  check-for-response:
    uses: aws-deadline/.github/.github/workflows/reusable_responded.yml@mainline
    permissions:
      issues: write
      pull-requests: write
