# Perform a manual PyPI release outside of the regular release process
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: ""
        type: string

jobs:
  ValidateTag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic versioning
        env:
          # Pass context via env, not inline ${{ }}, to avoid template injection.
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag '$TAG' does not follow semantic versioning format (X.Y.Z)"
            exit 1
          fi
          echo "Tag validation successful"
                
  UnitTests:
    name: Unit Tests
    uses: ./.github/workflows/code_quality.yml
    with:
      tag: ${{ inputs.tag }}

  VerifyGitHubRelease:
    needs: ValidateTag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

  PublishToPyPI:
    needs: [UnitTests, VerifyGitHubRelease]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install --upgrade hatch
      - name: Build
        run: hatch -v build
      # # See https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
