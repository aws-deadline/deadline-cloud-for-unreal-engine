name: "Release: Stage and Publish"
run-name: "Release: Stage and Publish ${{ inputs.tag || github.sha }}"

on:
  push:
    branches: [mainline]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to stage and publish again
        required: true
        type: string

# Never cancel a release waiting for Conda when another changelog merges.
concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  TagRelease:
    if: >-
      github.repository == 'aws-deadline/deadline-cloud-for-unreal-engine' &&
      github.ref == 'refs/heads/mainline' &&
      vars.EVENT_DRIVEN_CONDA_RELEASE_ENABLED == 'true'
    uses: aws-deadline/.github/.github/workflows/reusable_tag_release.yml@mainline
    secrets: inherit
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

  UnitTests:
    needs: [TagRelease]
    name: Unit and Integration Tests
    uses: ./.github/workflows/code_quality.yml
    with:
      tag: ${{ needs.TagRelease.outputs.tag }}

  IntegrationTests:
    needs: [TagRelease]
    name: Integration and UI Automation Tests
    uses: aws-deadline/.github/.github/workflows/reusable_integration_test.yml@mainline
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      # Unreal has no release integ/e2e projects; test the release tag using the mainline projects.
      environment: mainline
      os: windows
      tag: ${{ needs.TagRelease.outputs.tag }}
      run_ui_automation: true

  E2ETests:
    needs: [TagRelease]
    name: E2E Tests
    uses: aws-deadline/.github/.github/workflows/reusable_e2e_test.yml@mainline
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      # Unreal has no release integ/e2e projects; test the release tag using the mainline projects.
      environment: mainline
      os: windows
      tag: ${{ needs.TagRelease.outputs.tag }}

  Publish:
    needs: [TagRelease, UnitTests, IntegrationTests, E2ETests]
    uses: aws-deadline/.github/.github/workflows/reusable_publish_python.yml@mainline
    permissions:
      id-token: write
    secrets: inherit
    with:
      tag: ${{ needs.TagRelease.outputs.tag }}

  AuthorizePublish:
    needs: [TagRelease, Publish]
    permissions:
      id-token: write
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Verify release gate configuration
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.TagRelease.outputs.tag }}
          GATE_ENVIRONMENT: ${{ vars.CONDA_RELEASE_ENVIRONMENT || 'conda-release' }}
          REGISTRATION_ROLE: ${{ vars[vars.CONDA_RELEASE_ENVIRONMENT == 'conda-gamma' && 'CONDA_RELEASE_GAMMA_REGISTRATION_ROLE_ARN' || 'CONDA_RELEASE_REGISTRATION_ROLE_ARN'] }}
          QUEUE_URL: ${{ vars[vars.CONDA_RELEASE_ENVIRONMENT == 'conda-gamma' && 'CONDA_RELEASE_GAMMA_QUEUE_URL' || 'CONDA_RELEASE_QUEUE_URL'] }}
        run: |
          set -euo pipefail
          if [[ "$GATE_ENVIRONMENT" != "conda-gamma" && "$GATE_ENVIRONMENT" != "conda-release" ]]; then
            echo "::error::CONDA_RELEASE_ENVIRONMENT must be conda-gamma or conda-release."
            exit 1
          fi
          if [[ ! "$REGISTRATION_ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]] || [[ -z "$QUEUE_URL" ]]; then
            echo "::error::Configure the registration role and queue for the selected Conda gate. See docs/release-workflow.md."
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/$GATE_ENVIRONMENT" \
            | jq -e '
                [.protection_rules[]? | select(.type == "required_reviewers")] |
                length == 1 and
                (.[0].reviewers |
                  length == 1 and
                  .[0].type == "User" and
                  .[0].reviewer.login == "client-software-ci")
              ' > /dev/null; then
            echo "::error::$GATE_ENVIRONMENT must exist with client-software-ci as its sole required reviewer. See docs/release-workflow.md."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record the staged release identity
        env:
          RELEASE_TAG: ${{ needs.TagRelease.outputs.tag }}
        run: |
          export SOURCE_COMMIT="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          python scripts/conda_release.py metadata release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conda-release-metadata-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 90
      - name: Authenticate release registration
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars[vars.CONDA_RELEASE_ENVIRONMENT == 'conda-gamma' && 'CONDA_RELEASE_GAMMA_REGISTRATION_ROLE_ARN' || 'CONDA_RELEASE_REGISTRATION_ROLE_ARN'] }}
          aws-region: us-west-2
          role-session-name: conda-release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Register the staged release
        env:
          QUEUE_URL: ${{ vars[vars.CONDA_RELEASE_ENVIRONMENT == 'conda-gamma' && 'CONDA_RELEASE_GAMMA_QUEUE_URL' || 'CONDA_RELEASE_QUEUE_URL'] }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json
          from pathlib import Path
          release = json.loads(Path("release.json").read_text())
          request = {"kind": "register", **{key: release[key] for key in ("repository", "run_id", "run_attempt")}}
          Path("release-request.json").write_text(json.dumps(request))
          PYTHON
          aws sqs send-message --queue-url "$QUEUE_URL" \
            --message-body file://release-request.json --delay-seconds 60 \
            --region us-west-2 --query MessageId --output text

  CheckConda:
    name: Wait for Conda promotion
    needs: AuthorizePublish
    environment: ${{ vars.CONDA_RELEASE_ENVIRONMENT || 'conda-release' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: read
    steps:
      - name: Verify Conda gate approval
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: conda-release:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if ! gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses?per_page=100" \
            | jq -e --arg context "$STATUS_CONTEXT" '
                [.[][] | select(.context == $context)][0] |
                .state == "success" and .creator.login == "client-software-ci"
              ' > /dev/null; then
            echo "::error::Missing successful Conda gate status from client-software-ci for this run and attempt."
            exit 1
          fi
          echo "The Conda gate verified availability and approved the deployment." >> "$GITHUB_STEP_SUMMARY"

  PreRelease:
    needs: [TagRelease, CheckConda]
    if: needs.TagRelease.outputs.tag != ''
    uses: aws-deadline/.github/.github/workflows/reusable_prerelease.yml@mainline
    permissions:
      id-token: write
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.TagRelease.outputs.tag }}

  Release:
    needs: [TagRelease, PreRelease]
    if: needs.TagRelease.outputs.tag != ''
    uses: aws-deadline/.github/.github/workflows/reusable_release.yml@mainline
    secrets: inherit
    permissions:
      id-token: write
      contents: write
    with:
      tag: ${{ needs.TagRelease.outputs.tag }}

  PublishToPyPI:
    needs: [TagRelease, Release]
    if: needs.TagRelease.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.TagRelease.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.TagRelease.outputs.build-python-version }}
      - name: Install dependencies
        run: pip install --upgrade hatch
      - name: Build
        run: hatch -v build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
