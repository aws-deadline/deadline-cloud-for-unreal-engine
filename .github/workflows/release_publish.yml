name: "Release: Stage and Publish"
run-name: "Release: Stage and Publish ${{ inputs.tag || github.sha }}"

on:
  push:
    branches: [mainline]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to stage and publish again
        required: true
        type: string

# Never cancel a release waiting for Conda when another changelog merges.
concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  TagRelease:
    if: >-
      github.repository == 'aws-deadline/deadline-cloud-for-unreal-engine' &&
      github.ref == 'refs/heads/mainline' &&
      vars.EVENT_DRIVEN_CONDA_RELEASE_ENABLED == 'true'
    uses: aws-deadline/.github/.github/workflows/reusable_tag_release.yml@mainline
    secrets: inherit
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

  UnitTests:
    needs: [TagRelease]
    name: Unit and Integration Tests
    uses: ./.github/workflows/code_quality.yml
    with:
      tag: ${{ needs.TagRelease.outputs.tag }}

  IntegrationTests:
    needs: [TagRelease]
    name: Integration and UI Automation Tests
    uses: aws-deadline/.github/.github/workflows/reusable_integration_test.yml@mainline
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      # Unreal has no release integ/e2e projects; test the release tag using the mainline projects.
      environment: mainline
      os: windows
      tag: ${{ needs.TagRelease.outputs.tag }}
      run_ui_automation: true

  E2ETests:
    needs: [TagRelease]
    name: E2E Tests
    uses: aws-deadline/.github/.github/workflows/reusable_e2e_test.yml@mainline
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      # Unreal has no release integ/e2e projects; test the release tag using the mainline projects.
      environment: mainline
      os: windows
      tag: ${{ needs.TagRelease.outputs.tag }}

  Publish:
    needs: [TagRelease, UnitTests, IntegrationTests, E2ETests]
    uses: aws-deadline/.github/.github/workflows/reusable_publish_python.yml@mainline
    permissions:
      id-token: write
    secrets: inherit
    with:
      tag: ${{ needs.TagRelease.outputs.tag }}

  AuthorizePublish:
    needs: [TagRelease, Publish]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Verify release gate configuration
        id: release
        env:
          TAG: ${{ needs.TagRelease.outputs.tag }}
          APP_ID: ${{ vars.CONDA_RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$APP_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Configure CONDA_RELEASE_APP_ID before releasing. See docs/release-workflow.md."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record the staged release identity
        env:
          RELEASE_TAG: ${{ needs.TagRelease.outputs.tag }}
        run: |
          export SOURCE_COMMIT="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          python scripts/conda_release.py metadata release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: conda-release-metadata-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 90

  CheckConda:
    name: Wait for Conda promotion
    needs: AuthorizePublish
    environment: conda-release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.readiness.outputs.tag }}
      ready: ${{ steps.readiness.outputs.ready }}
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.AuthorizePublish.outputs.artifact_id }}
          merge-multiple: true
      - name: Verify the App approval for this run and attempt
        id: readiness
        env:
          TAG: ${{ needs.AuthorizePublish.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          CONDA_RELEASE_APP_ID: ${{ vars.CONDA_RELEASE_APP_ID }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=all&per_page=100" > checks.json
          python scripts/conda_release.py verify release.json checks.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "### Conda promotion approved" >> "$GITHUB_STEP_SUMMARY"
          echo "The App approved this release and the public Conda manifest contains the required package version and platform." >> "$GITHUB_STEP_SUMMARY"

  ValidateRelease:
    needs: CheckConda
    if: needs.CheckConda.outputs.ready == 'true' && needs.CheckConda.outputs.tag != ''
    uses: aws-deadline/.github/.github/workflows/reusable_tag_release.yml@mainline
    permissions:
      contents: read
    secrets: inherit
    with:
      tag: ${{ needs.CheckConda.outputs.tag }}

  PreRelease:
    needs: ValidateRelease
    if: needs.ValidateRelease.outputs.tag != ''
    uses: aws-deadline/.github/.github/workflows/reusable_prerelease.yml@mainline
    permissions:
      id-token: write
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.ValidateRelease.outputs.tag }}

  Release:
    needs: [ValidateRelease, PreRelease]
    if: needs.ValidateRelease.outputs.tag != ''
    uses: aws-deadline/.github/.github/workflows/reusable_release.yml@mainline
    secrets: inherit
    permissions:
      id-token: write
      contents: write
    with:
      tag: ${{ needs.ValidateRelease.outputs.tag }}

  PublishToPyPI:
    needs: [ValidateRelease, Release]
    if: needs.ValidateRelease.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ValidateRelease.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.ValidateRelease.outputs.build-python-version }}
      - name: Install dependencies
        run: pip install --upgrade hatch
      - name: Build
        run: hatch -v build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
