[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "deadline-cloud-for-unreal-engine"
description = "AWS Deadline Cloud for Unreal Engine"
authors = [
  {name = "Amazon Web Services"},
]
dynamic = ["version"]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop"
]

dependencies = [
    # 0.60.4 is the floor because AWS Console sign-in landed there and nowhere earlier:
    # 0.60.1 through 0.60.3 have no AWS_CONSOLE_LOGIN credentials source, and do not
    # declare a `console` extra at all.
    #
    # The console extra is deliberately NOT requested here. It is only needed by the
    # submitter, and it pulls awscrt, a compiled wheel. These base dependencies are
    # resolved into the adaptor package by scripts/create_adaptor_packaging_artifact.sh
    # with --only-binary=:all: --platform <tag>, and no awscrt wheel satisfying the
    # 0.28.4 floor exists for the macosx_10_9_x86_64 tag that script uses -- pip walks
    # back to 0.25.7, which has no usable crypto support, so console sign-in would
    # appear installed and silently not work. The adaptor never takes the console
    # path anyway: it runs on a worker with host-provided credentials. The submitter
    # install paths request the extra themselves: the dependency bundle in depsBundle.py,
    # the .uplugin in its PythonRequirements, and direct pip installs through this
    # package's own `console` extra (declared below).
    "deadline >= 0.60.4,< 0.61",
    "openjd-adaptor-runtime >= 0.9.4,< 0.10",
    "openjd-model >= 0.10.0, < 0.12",
    'p4python == 2026.1.3027817; python_version >= "3.10"',
    'p4python == 2025.1.2767466; python_version <  "3.10"',
]

[project.optional-dependencies]
# Covers the install path that goes through pip directly (docs/user_guide/
# setup-submitter.md, option 1) rather than through the .uplugin's PythonRequirements or
# the dependency bundle, both of which request deadline's console extra themselves. An
# extra rather than part of dependencies because those are also resolved into the adaptor
# package, where awscrt is unusable and unavailable (see the comment above). A unit test
# keeps this restated range equal to the deadline pin in dependencies.
console = [
    "deadline[console] >= 0.60.4,< 0.61",
]

[project.urls]
Homepage = "https://github.com/aws-deadline/deadline-cloud-for-unreal-engine"
Source = "https://github.com/aws-deadline/deadline-cloud-for-unreal-engine"

[project.scripts]
unreal-engine-openjd = "deadline.unreal_adaptor.UnrealAdaptor:main"
unreal-engine-p4-utils = "deadline.unreal_perforce_utils.cli:main"

[tool.hatch.build]
artifacts = [
  "*_version.py",
]


[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_custom_hook.py"

[tool.hatch.build.hooks.custom.copy_version_py]
destinations = [
  "src/deadline/unreal_adaptor",
  "src/deadline/unreal_submitter",
  "src/deadline/unreal_logger",
  "src/deadline/unreal_perforce_utils",
  "src/deadline/unreal_cmd_utils",  
]

[tool.hatch.build.targets.sdist]
include = [
    "src/*",
    "hatch_custom_hook.py",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/deadline",
]

[tool.mypy]
python_version = 3.9
check_untyped_defs = true
show_error_codes = true
pretty = true
files = [ "src/**/*.py" ]
ignore_missing_imports = true
# Tell mypy that there's a namespace package at src/deadline
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

# unreal.* is a UE4 stub that doesn't exist outside the engine.
# _pytest/pytest: pytest 9+ uses Python 3.10 syntax (match statements) which
# mypy cannot parse when python_version is set to 3.9.
[[tool.mypy.overrides]]
module = ["unreal.*", "_pytest.*", "pytest.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["deadline", "openjd"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
    "--durations=5",
    "--cov=src/deadline/unreal_adaptor",
    "--cov=src/deadline/unreal_submitter",
    "--cov=src/deadline/unreal_logger",
    "--cov=src/deadline/unreal_perforce_utils",
    "--cov=src/deadline/unreal_cmd_utils",    
    "--color=yes",
    "--cov-report=html:build/coverage",
    "--cov-report=xml:build/coverage/coverage.xml",
    "--cov-report=term-missing"  # ,
    # "--numprocesses=auto",
]
testpaths = [ "test" ]
looponfailroots = [
    "src",
    "test",
]
# looponfailroots is deprecated, this removes the deprecation from the test output
filterwarnings = [
    "ignore::DeprecationWarning"
]


[tool.coverage.run]
source_pkgs = [
    "src/deadline/unreal_adaptor",
    "src/deadline/unreal_submitter",
    "src/deadline/unreal_logger",
    "src/deadline/unreal_perforce_utils",
    "src/deadline/unreal_cmd_utils",
]
branch = true
parallel = true
omit = [
  "**/__main__.py",
  "**/_version.py"
]


[tool.coverage.paths]
source = [
  "src/"
]

[tool.coverage.report]
show_missing = true
fail_under = 65
[tool.semantic_release]
# Can be removed or set to true once we are v1
major_on_zero = false
allow_zero_version = true
tag_format = "{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = []
patch_tags = [
  "chore",
  "feat",
  "fix",
  "refactor",
  "perf",
]

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.semantic_release.changelog]
template_dir = ".semantic_release"

[tool.semantic_release.changelog.environment]
trim_blocks = true
lstrip_blocks = true

[tool.semantic_release.branches.release]
match = "(mainline|release|patch_.*)"
