specificationVersion: jobtemplate-2023-09
extensions:
  - REDACTED_ENV_VARS
name: RenderJob
parameterDefinitions:
- name: ProjectFilePath
  type: PATH
  objectType: FILE
  dataFlow: IN
- name: ExtraCmdArgs
  type: STRING
  default: '-log'
- name: ExtraCmdArgsFile
  type: PATH
  objectType: FILE
  dataFlow: IN
- name: Executable
  type: STRING
  default: 'UnrealEditor-Cmd'
- name: CondaPackages
  type: STRING
  default: unrealengine=5.6 unrealengine-openjd=0.5.*
- name: CondaChannels
  type: STRING
  default: deadline-cloud
- name: ChunkSize
  type: INT
  default: 1  