specificationVersion: jobtemplate-2023-09
extensions:
  - REDACTED_ENV_VARS
  - TASK_CHUNKING
name: RenderJob
parameterDefinitions:
- name: ProjectFilePath
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface: 
   control: HIDDEN
- name: ExtraCmdArgs
  type: STRING
  default: '-log'
  userInterface: 
   control: LINE_EDIT
- name: ExtraCmdArgsFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface: 
   control: HIDDEN
- name: Executable
  type: STRING
  default: 'UnrealEditor-Cmd'
  userInterface: 
   control: HIDDEN
- name: Frames
  type: STRING
  description: 'Frame range from MRQ settings. Populated by submitter at submission time.'
  userInterface: 
   control: HIDDEN
- name: ChunkSize
  type: INT
  default: 50
  minValue: 1
  description: 'Default number of frames to include in a dynamic chunk'
  userInterface:
   control: SPIN_BOX
   label: Default Dynamic Chunk Size
- name: TargetRuntimeSeconds
  type: INT
  default: 0
  minValue: 0
  description: 'Target runtime in seconds per chunk. Default "0" means do not use time-based dynamic chunking.'
  userInterface:
   control: SPIN_BOX
   label: Target Runtime Seconds
- name: CondaPackages
  type: STRING
  default: unrealengine=5.6 unrealengine-openjd=0.6.*
  userInterface: 
   control: LINE_EDIT
- name: CondaChannels
  type: STRING
  default: deadline-cloud
  userInterface: 
   control: LINE_EDIT