specificationVersion: jobtemplate-2023-09
extensions:
  - REDACTED_ENV_VARS
  - TASK_CHUNKING
name: RenderJob
parameterDefinitions:
- name: ProjectFilePath
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface: 
   control: HIDDEN
- name: ExtraCmdArgs
  type: STRING
  default: '-log'
  userInterface: 
   control: LINE_EDIT
- name: ExtraCmdArgsFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface: 
   control: HIDDEN
- name: Executable
  type: STRING
  default: 'UnrealEditor-Cmd'
  userInterface: 
   control: HIDDEN
- name: Frames
  type: STRING
  description: 'Frame range from MRQ settings. Populated by submitter at submission time.'
  userInterface: 
   control: HIDDEN
- name: ChunkSize
  type: INT
  default: 50
  minValue: 1
  description: 'Default number of frames to include in a dynamic chunk'
  userInterface: 
   control: SPIN_BOX
   label: Default Dynamic Chunk Size
- name: TargetRuntimeSeconds
  type: INT
  default: 0
  minValue: 0
  description: 'Optional target runtime in seconds per chunk. When 0 (default), chunking uses Default Dynamic Chunk Size for all chunks.'
  userInterface: 
   control: SPIN_BOX
   label: Target Runtime Seconds
- name: CondaPackages
  type: STRING
  # Dynamic chunking requires an adaptor that understands the
  # dynamic_chunked_frames run_data key, available in adaptor 0.7.1 and later.
  # This release moves the template pin to the 1.0 adaptor line. A
  # customer-managed installation that was never upgraded or a hand-edited
  # CondaPackages value that pins an older adaptor can lack dynamic chunking
  # support.
  default: unrealengine=5.8 unrealengine-openjd=1.0.*
  userInterface: 
   control: LINE_EDIT
   label: Conda Packages
- name: CondaChannels
  type: STRING
  default: deadline-cloud-v2 deadline-cloud
  userInterface: 
   control: LINE_EDIT
   label: Conda Channels
- name: MarketplacePluginsDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  default: ''
  userInterface:
   control: HIDDEN
