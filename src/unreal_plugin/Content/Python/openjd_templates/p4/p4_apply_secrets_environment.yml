# OpenJD Environment for retrieving Perforce credentials from AWS Secrets Manager and applying them to the connection.
# These environment variables will appear in the logs with the prefix "openjd_env".
# Sensitive data, such as the port, user and password, will be redacted in the log.

name: P4ApplySecrets
variables:
  AWS_SECRET_P4INFO: ""
script:
  actions:
    onEnter:
      command: unreal-engine-p4-utils
      args:
      - apply_perforce_secrets
      cancelation:
        mode: NOTIFY_THEN_TERMINATE