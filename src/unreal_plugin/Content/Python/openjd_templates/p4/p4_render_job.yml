specificationVersion: jobtemplate-2023-09
extensions:
  - REDACTED_ENV_VARS
name: RenderJob
parameterDefinitions:
- name: ProjectRelativePath
  type: STRING
- name: ProjectName
  type: STRING
- name: PerforceChangelistNumber
  type: STRING
- name: PerforceWorkspaceSpecificationTemplate
  type: PATH
  objectType: FILE
  dataFlow: IN
- name: MrqJobDependenciesDescriptor
  type: PATH
  objectType: FILE
  dataFlow: IN
- name: ExtraCmdArgs
  type: STRING
  default: '-log'
- name: ExtraCmdArgsFile
  type: PATH
  objectType: FILE
  dataFlow: IN
- name: Executable
  type: STRING
  default: 'UnrealEditor-Cmd'
- name: FramesPerTask
  type: INT
  default: 0
- name: CondaPackages
  type: STRING
  default: unrealengine=5.8 unrealengine-openjd=0.7.*
  userInterface: 
   control: LINE_EDIT
- name: CondaChannels
  type: STRING
  default: deadline-cloud-v2 deadline-cloud
  userInterface: 
   control: LINE_EDIT
- name: ShotsPerTask
  type: INT
  default: 1
- name: MarketplacePluginsDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  default: ''
  userInterface:
   control: HIDDEN
- name: SubmitMode
  description: >-
    Optional Perforce submit for render outputs. Job Attachments still uploads
    outputs as configured on the queue regardless of this setting. Leave empty
    (default) to skip the Perforce write. Set to 'submit' to commit each task's
    outputs to a new changelist on the worker that produced them, or 'shelve'
    to create a shelved changelist (CL number emitted as SHELVED_CL for
    downstream assembly tasks).
  type: STRING
  default: ''
  allowedValues:
  - ''
  - submit
  - shelve
  userInterface:
   control: DROPDOWN_LIST
   label: Submit Renders to Perforce
