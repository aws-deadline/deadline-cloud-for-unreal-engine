name: Render
parameterSpace:
  taskParameterDefinitions:
  - name: Handler
    type: STRING
    range: []
  - name: QueueManifestPath
    type: PATH
    range: []
  - name: FramesPerTask
    type: INT
    range: []
  - name: ShotsPerTask
    type: INT
    range: []
  - name: TaskIndex
    type: INT
    range: []
script:
  embeddedFiles:
  - name: runData
    filename: run-data.yaml
    type: TEXT
    data: |
      handler: {{Task.Param.Handler}}
      queue_manifest_path: {{Task.Param.QueueManifestPath}}
      frames_per_task: {{Task.Param.FramesPerTask}}
      shots_per_task: {{Task.Param.ShotsPerTask}}
      task_index: {{Task.Param.TaskIndex}}
  actions:
    onRun:
      command: unreal-engine-openjd
      args:
      - daemon
      - run
      - --connection-file
      - '{{Session.WorkingDirectory}}/connection.json'
      - --run-data
      - file://{{Task.File.runData}}
      cancelation:
        mode: NOTIFY_THEN_TERMINATE