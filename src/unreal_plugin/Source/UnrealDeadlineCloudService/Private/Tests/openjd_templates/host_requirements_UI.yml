hostRequirements:
  amounts:
    - name: amount.worker.vcpu
      min: 32
    - name: amount.worker.memory
      min: 8
    - name: amount.worker.gpu
      min: 1
    - name: amount.worker.gpu.memory
      min: 8
      max: 24
    - name: amount.worker.disk.scratch
      max: 16
    - name: amount.test
      max: 16

  attributes:
    - name: attr.worker.os.family
      anyOf: [windows]
    - name: attr.worker.cpu.arch
      anyOf: [x86_64]
    - name: attr.test
      allOf: [test]    
      